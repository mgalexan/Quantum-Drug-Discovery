[project]
name = "amath499"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "hydra-core>=1.3.2",
    "ipykernel>=7.1.0",
    "matplotlib>=3.10.8",
    "nevergrad>=1.0.12",
    "omegaconf>=2.3.0",
    "pylatexenc>=2.10",
    "pyyaml>=6.0.3",
    "qiskit>=2.3.0",
    "qiskit-aer>=0.17.2",
    "tqdm>=4.67.1",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
